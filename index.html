<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BelegFlow — Deine Ausgaben im Blick</title>
<meta name="description" content="BelegFlow analysiert deine Kassenbons und zeigt dir, wohin dein Geld fließt.">
<meta name="theme-color" content="#fbfbfd">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230a84ff'/%3E%3Cpath d='M30 25h40a5 5 0 015 5v45l-8-6-8 6-9-6-9 6-8-6-8 6V30a5 5 0 015-5z' fill='white'/%3E%3Cline x1='38' y1='40' x2='62' y2='40' stroke='%230a84ff' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='38' y1='50' x2='62' y2='50' stroke='%230a84ff' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='38' y1='60' x2='52' y2='60' stroke='%230a84ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app">

  <!-- Sidebar (Desktop/Tablet) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 3h12a1 1 0 011 1v16.2a.6.6 0 01-.92.5l-1.83-1.2-1.83 1.2a.6.6 0 01-.66 0l-1.76-1.2-1.76 1.2a.6.6 0 01-.66 0l-1.83-1.2-1.83 1.2A.6.6 0 015 20.2V4a1 1 0 011-1z" fill="currentColor"/><path d="M8.5 8.5h7M8.5 11.5h7M8.5 14.5h4" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">BelegFlow</span>
    </div>

    <button class="btn btn-primary sidebar-add" id="btnAddReceiptSidebar" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>Beleg hinzufügen</span>
    </button>

    <nav class="sidebar-nav" aria-label="Hauptnavigation">
      <button class="nav-item" data-view="overview" type="button">
        <span class="nav-icon" data-icon="home"></span><span class="nav-label">Übersicht</span>
      </button>
      <button class="nav-item" data-view="receipts" type="button">
        <span class="nav-icon" data-icon="receipt"></span><span class="nav-label">Belege</span>
      </button>
      <button class="nav-item" data-view="expenses" type="button">
        <span class="nav-icon" data-icon="list"></span><span class="nav-label">Ausgaben</span>
      </button>
      <button class="nav-item" data-view="analysis" type="button">
        <span class="nav-icon" data-icon="trend"></span><span class="nav-label">Analyse</span>
      </button>
      <button class="nav-item" data-view="settings" type="button">
        <span class="nav-icon" data-icon="settings"></span><span class="nav-label">Einstellungen</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Design umschalten">
        <span data-icon="sun"></span><span data-icon="moon"></span><span data-icon="system"></span>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <h1 class="topbar-title" id="pageTitle">Übersicht</h1>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <main class="content" id="content">
      <section class="view" id="view-overview"></section>
      <section class="view" id="view-receipts" hidden></section>
      <section class="view" id="view-expenses" hidden></section>
      <section class="view" id="view-analysis" hidden></section>
      <section class="view" id="view-settings" hidden></section>
    </main>
  </div>

  <!-- Bottom Navigation (Mobile) -->
  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <button class="bnav-item" data-view="overview" type="button"><span class="nav-icon" data-icon="home"></span><span>Übersicht</span></button>
    <button class="bnav-item" data-view="receipts" type="button"><span class="nav-icon" data-icon="receipt"></span><span>Belege</span></button>
    <button class="bnav-item" data-view="expenses" type="button"><span class="nav-icon" data-icon="list"></span><span>Ausgaben</span></button>
    <button class="bnav-item" data-view="analysis" type="button"><span class="nav-icon" data-icon="trend"></span><span>Analyse</span></button>
    <button class="bnav-item" data-view="settings" type="button"><span class="nav-icon" data-icon="settings"></span><span>Mehr</span></button>
  </nav>

  <button class="fab" id="fabAdd" type="button" aria-label="Beleg hinzufügen">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>

<script src="vendor/chart.umd.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
